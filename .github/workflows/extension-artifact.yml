name: Extension Artifact

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  package-extension:
    runs-on: ubuntu-latest
    env:
      WXT_PUBLIC_API_BASE_URL: ${{ vars.WXT_PUBLIC_API_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build extension
        run: pnpm --filter extension build

      - name: Package Chrome MV3 extension
        run: |
          cd extension/.output/chrome-mv3
          zip -r ../../../lumos-ai-writer-chrome-mv3.zip .

      - name: Upload extension zip
        uses: actions/upload-artifact@v4
        with:
          name: lumos-ai-writer-chrome-mv3
          path: lumos-ai-writer-chrome-mv3.zip
