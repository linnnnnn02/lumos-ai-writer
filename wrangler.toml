name = "lumos-ai-writer"
compatibility_date = "2026-05-31"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "web/dist"

[vars]
APP_ENV = "production"
PUBLIC_APP_URL = "https://lumos-ai-writer.pages.dev"
CORS_ALLOWED_ORIGINS = "https://lumos-ai-writer.pages.dev"
AUTH_OAUTH_PROVIDERS = "none"
AI_FEATURE_ENABLED = "false"
AI_PROVIDER_PRIMARY = "deepseek"
AI_DAILY_BUDGET_CNY = "5"
# Conservative CNY estimates for deepseek-v4-flash cache-miss pricing.
AI_DEEPSEEK_INPUT_CNY_PER_1M_TOKENS = "1.10"
AI_DEEPSEEK_OUTPUT_CNY_PER_1M_TOKENS = "2.10"
